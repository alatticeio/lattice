[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lattice-sdk"
version = "0.1.0"
description = "Python SDK for Lattice — Zero-Trust networking for AI agents"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-anyio", "respx>=0.21", "anyio[trio]"]
