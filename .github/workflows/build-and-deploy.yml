name: CI/CD Pipeline

on:
  pull_request_target:
    types: [labeled, synchronize]
  push:
    branches:
      - master

jobs:
  test:
    if: |
      github.event_name == 'push' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'OWNER' ||
      contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Create dist placeholder for embed
        run: mkdir -p internal/web/dist && echo '<!DOCTYPE html>' > internal/web/dist/index.html

      - name: Run unit tests
        run: go test ./internal/... ./pkg/... -count=1 -timeout 5m

  # 1. 在 GitHub 免费资源上构建并推送
  build-and-push:
    needs: test
    if: |
      github.event_name == 'push' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'OWNER' ||
      contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.32.1

      # 构建并推送 latticed（all-in-one）和 lattice（边缘 agent），社区版 + PRO 版
      - name: Build and Push Images
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY="ghcr.io/${OWNER_LOWER}"
          CACHE="--cache-from type=gha --cache-to type=gha,mode=max"

          if [ "${{ github.event_name }}" == "push" ]; then
            TAG="latest"
          else
            TAG="pr-${{ github.event.pull_request.number }}"
          fi

          # Community edition
          make docker-build SERVICE=latticed TAG="$TAG"         REGISTRY="$REGISTRY" BUILD_CACHE_ARGS="$CACHE"
          make docker-build SERVICE=lattice  TAG="$TAG"         REGISTRY="$REGISTRY" BUILD_CACHE_ARGS="$CACHE"
          make docker-push  SERVICE=latticed TAG="$TAG"         REGISTRY="$REGISTRY"
          make docker-push  SERVICE=lattice  TAG="$TAG"         REGISTRY="$REGISTRY"

          # PRO edition
          make docker-build SERVICE=latticed TAG="pro-${TAG}"   REGISTRY="$REGISTRY" EDITION=pro BUILD_CACHE_ARGS="--cache-from type=gha"
          make docker-build SERVICE=lattice  TAG="pro-${TAG}"   REGISTRY="$REGISTRY" EDITION=pro BUILD_CACHE_ARGS="--cache-from type=gha"
          make docker-push  SERVICE=latticed TAG="pro-${TAG}"   REGISTRY="$REGISTRY"
          make docker-push  SERVICE=lattice  TAG="pro-${TAG}"   REGISTRY="$REGISTRY"

  # 2. 在 Self-hosted 服务器上部署 all-in-one（PR 预览 + merge 到 master 后正式部署）
  deploy:
    needs: build-and-push
    if: |
      github.event_name == 'push' ||
      (github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'OWNER')
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to K3s/K8s
        run: |
          export PATH=$PATH:/usr/local/go/bin:$(go env GOPATH)/bin

          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          if [ "${{ github.event_name }}" == "push" ]; then
            TAG="latest"
            echo "Deploying master (latest)"
          else
            TAG="pr-${{ github.event.pull_request.number }}"
            echo "Deploying pr-${{ github.event.pull_request.number }}"
          fi

          make undeploy-aio
          make deploy-aio IMG="ghcr.io/${OWNER_LOWER}/latticed:${TAG}"

#      - name: Run E2E Tests
#        if: contains(github.event.pull_request.labels.*.name, 'run-e2e')
#        run: |
#          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
#          TAG="pr-${{ github.event.pull_request.number }}"
#          make test-e2e LOCAL_AGENT_IMAGE="ghcr.io/${OWNER_LOWER}/lattice:${TAG}"
