name: Lattice E2E Test

on:
  push:
    branches: [dev]
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    branches:
      - master
      - main

env:
  REGISTRY: ghcr.io/alatticeio
  CLUSTER_NAME: lattice-e2e
  E2E_KUBECONFIG: /tmp/lattice-e2e.kubeconfig

permissions:
  contents: read
  packages: write

jobs:
  e2e-test:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-e2e'))

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-buildx-action@v3

      - name: Compute build variables
        run: |
          IS_PRO=${{ contains(github.event.pull_request.labels.*.name, 'run-pro') }}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="pr-${{ github.event.pull_request.number }}"
          elif [ "${{ github.ref }}" = "refs/heads/master" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG="latest"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "IS_PRO=$IS_PRO" >> "$GITHUB_ENV"

      - name: Install kustomize
        run: |
          make kustomize
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Setup pnpm
        run: npm install -g pnpm@10.32.1

      - name: Build community images
        run: |
          make docker-build SERVICE=latticed TAG=$TAG REGISTRY=$REGISTRY
          make docker-build SERVICE=lattice  TAG=$TAG REGISTRY=$REGISTRY

      - name: Build PRO images
        if: env.IS_PRO == 'true'
        run: |
          make docker-build SERVICE=latticed TAG=${TAG}-pro REGISTRY=$REGISTRY EDITION=pro
          make docker-build SERVICE=lattice  TAG=${TAG}-pro REGISTRY=$REGISTRY EDITION=pro

      - name: Push images to registry
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          make docker-push SERVICE=latticed TAG=$TAG REGISTRY=$REGISTRY
          make docker-push SERVICE=lattice  TAG=$TAG REGISTRY=$REGISTRY

      - name: Setup k3d cluster
        uses: AbsaOSS/k3d-action@v2
        with:
          cluster-name: ${{ env.CLUSTER_NAME }}
          args: >-
            --agents 0
            --no-lb
            --k3s-arg "--disable=traefik@server:*"

      - name: Export kubeconfig
        run: |
          k3d kubeconfig get $CLUSTER_NAME > $E2E_KUBECONFIG
          echo "KUBECONFIG=$E2E_KUBECONFIG" >> "$GITHUB_ENV"

      - name: Import images into k3d
        run: |
          k3d image import $REGISTRY/latticed:$TAG -c $CLUSTER_NAME
          k3d image import $REGISTRY/lattice:$TAG  -c $CLUSTER_NAME
          if [ "$IS_PRO" = "true" ]; then
            k3d image import $REGISTRY/latticed:${TAG}-pro -c $CLUSTER_NAME
            k3d image import $REGISTRY/lattice:${TAG}-pro  -c $CLUSTER_NAME
          fi

      - name: Build sandbox+gVisor image and rootfs (PRO only)
        if: env.IS_PRO == 'true'
        run: |
          echo "====> Downloading runsc..."
          curl -fsSL -o /tmp/runsc https://storage.googleapis.com/gvisor/releases/release/latest/x86_64/runsc || \
            curl -fsSL -o /tmp/runsc https://storage.googleapis.com/gvisor/releases/release/20250519.1/x86_64/runsc
          chmod +x /tmp/runsc
          # Verify it's a valid ELF binary.
          file /tmp/runsc | grep -q ELF || { echo "❌ runsc is not a valid ELF binary"; file /tmp/runsc; exit 1; }

          echo "====> Building lattice binary (pro)..."
          make build SERVICE=lattice EDITION=pro

          echo "====> Building gVisor rootfs Docker image..."
          docker build \
            -t lattice-gvisor-rootfs:e2e \
            -f test/e2e/rootfs_test/Dockerfile \
            .
          echo "====> Exporting rootfs..."
          rm -rf /tmp/lattice-gvisor-rootfs
          mkdir -p /tmp/lattice-gvisor-rootfs
          CID=$(docker create lattice-gvisor-rootfs:e2e)
          docker export $CID | tar -xf - -C /tmp/lattice-gvisor-rootfs
          docker rm $CID > /dev/null
          echo "====> Copying rootfs to k3d node..."
          docker cp /tmp/lattice-gvisor-rootfs k3d-${CLUSTER_NAME}-server-0:/tmp/lattice-gvisor-rootfs

          echo "====> Building sandbox+gVisor image (sandbox + runsc)..."
          GVISOR_SANDBOX_IMG="${REGISTRY}/lattice:${TAG}-pro-sandbox"
          mkdir -p /tmp/gvisor-sandbox
          cp /tmp/runsc /tmp/gvisor-sandbox/runsc
          cat > /tmp/gvisor-sandbox/Dockerfile <<DOCKERFILE
          FROM ${REGISTRY}/lattice:${TAG}-pro
          COPY runsc /usr/local/bin/runsc
          RUN chmod +x /usr/local/bin/runsc
          DOCKERFILE
          docker build -t ${GVISOR_SANDBOX_IMG} /tmp/gvisor-sandbox
          k3d image import ${GVISOR_SANDBOX_IMG} -c ${CLUSTER_NAME}
          echo "GVISOR_SANDBOX_IMG=${GVISOR_SANDBOX_IMG}" >> "$GITHUB_ENV"

          echo "✅ Rootfs + sandbox+gvisor image ready"

      - name: Deploy Lattice all-in-one
        run: |
          if [ "$IS_PRO" = "true" ]; then
            LATTICED_IMG="$REGISTRY/latticed:${TAG}-pro"
          else
            LATTICED_IMG="$REGISTRY/latticed:$TAG"
          fi
          make deploy-aio IMG="$LATTICED_IMG" KUBECTL="kubectl --kubeconfig=$E2E_KUBECONFIG"

      - name: Run E2E tests
        run: |
          if [ "$IS_PRO" = "true" ]; then
            make test-e2e \
              LOCAL_AGENT_IMAGE="$REGISTRY/lattice:${TAG}-pro" \
              LOCAL_SANDBOX_IMAGE="${GVISOR_SANDBOX_IMG:-$REGISTRY/lattice:${TAG}-pro}" \
              E2E_KUBECONFIG="$E2E_KUBECONFIG"
          else
            make test-e2e \
              LOCAL_AGENT_IMAGE="$REGISTRY/lattice:$TAG" \
              E2E_KUBECONFIG="$E2E_KUBECONFIG"
          fi

      - name: Collect failure logs
        if: failure()
        run: |
          kc="kubectl --kubeconfig=$E2E_KUBECONFIG"
          echo "===== lattice-system ====="
          $kc get all -n lattice-system -o wide || true
          echo "===== latticed logs ====="
          $kc logs -n lattice-system -l app.kubernetes.io/name=latticed --tail=300 || true
          echo "===== E2E namespaces ====="
          $kc get wfnetwork,wfpeer --all-namespaces -o wide || true
          for ns in $($kc get ns -o name 2>/dev/null | grep "^namespace/wf-" | cut -d/ -f2); do
            echo "=== $ns ==="
            $kc get pods -n "$ns" -o wide || true
            $kc logs -n "$ns" --all-containers --tail=100 2>&1 || true
          done

      - name: Cleanup k3d cluster
        if: always()
        run: k3d cluster delete $CLUSTER_NAME 2>/dev/null || true
