name: Performance Benchmark

# Runs the three-dimensional benchmark suite (TTFH / throughput / API p99)
# and publishes results as Shields.io endpoint JSON to gh-pages.
#
# Trigger:
#   - Weekly on Monday 02:00 UTC (low-traffic window)
#   - Manual via workflow_dispatch (run before a release to verify SLAs)
#
# Outputs (committed to gh-pages branch):
#   docs/benchmarks/handshake.json
#   docs/benchmarks/throughput.json
#   docs/benchmarks/api-p99.json

on:
  schedule:
    - cron: '0 2 * * 1'   # every Monday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # needed to push to gh-pages
  packages: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start lattice-k3s
        run: |
          docker pull ghcr.io/alatticeio/lattice-k3s:latest
          docker run -d \
            --name lattice-k3s \
            --privileged \
            -p 8080:8080 \
            -p 4222:4222 \
            ghcr.io/alatticeio/lattice-k3s:latest

      - name: Wait for readiness
        run: |
          echo "Waiting for K8s API..."
          for i in $(seq 1 120); do
            docker exec lattice-k3s kubectl get nodes >/dev/null 2>&1 && break || true
            [ "$i" = "120" ] && { docker logs lattice-k3s | tail -20; exit 1; }
            sleep 1
          done

          echo "Waiting for CRDs..."
          for i in $(seq 1 60); do
            docker exec lattice-k3s kubectl get crd latticepeers.alattice.io >/dev/null 2>&1 && break || true
            [ "$i" = "60" ] && exit 1
            sleep 1
          done

          echo "Waiting for Lattice API..."
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || echo 000)
            [ "$CODE" != "000" ] && break || true
            [ "$i" = "60" ] && exit 1
            sleep 1
          done
          echo "Control plane ready"

      - name: Setup workspace and enrollment token
        run: |
          docker pull ghcr.io/alatticeio/lattice:latest
          docker build -t bench-image:ci -f hack/bench/Dockerfile.bench hack/bench/
          docker network create bench-net

          ADMIN_TOKEN=$(curl -s -X POST http://localhost:8080/api/v1/users/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"changeme"}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['token'])")
          echo "ADMIN_TOKEN=$ADMIN_TOKEN" >> "$GITHUB_ENV"

          WS=$(curl -s -X POST http://localhost:8080/api/v1/workspaces \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"name":"bench","displayName":"Benchmark"}')
          WS_ID=$(echo "$WS" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['id'])")
          echo "WS_ID=$WS_ID" >> "$GITHUB_ENV"

          docker run --rm --network host \
            -e LATTICE_AUTH_TOKEN="$ADMIN_TOKEN" \
            -e LATTICE_SERVER_URL="http://localhost:8080" \
            ghcr.io/alatticeio/lattice:latest \
            policy allow-all -n bench

          TOKEN=$(curl -s -X POST "http://localhost:8080/api/v1/workspaces/$WS_ID/tokens" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"name":"bench-token","limit":10,"expiry":"1h"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['token'])")
          echo "ENROLL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Benchmark 1 - Handshake (TTFH)
        run: |
          TOKEN="$ENROLL_TOKEN" \
          AGENT_API="http://localhost:8080" \
          AGENT_IMAGE="bench-image:ci" \
          RUNS=3 \
          bash hack/bench/handshake_bench.sh

      - name: Benchmark 2 - Throughput
        run: bash hack/bench/throughput_bench.sh

      - name: Remove bench agent containers
        run: |
          docker rm -f bench-agent-a bench-agent-b 2>/dev/null || true
          docker network rm bench-net 2>/dev/null || true

      - name: Benchmark 3 - API p99 latency
        run: |
          ADMIN_TOKEN="$ADMIN_TOKEN" \
          AGENT_API="http://localhost:8080" \
          bash hack/bench/api_bench.sh

      - name: Publish results to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p docs/benchmarks
          cp hack/bench/results/handshake.json  docs/benchmarks/handshake.json
          cp hack/bench/results/throughput.json docs/benchmarks/throughput.json
          cp hack/bench/results/api-p99.json    docs/benchmarks/api-p99.json

          export HISTORY_FILE=docs/benchmarks/history.json
          [ -f "$HISTORY_FILE" ] || echo "[]" > "$HISTORY_FILE"

          export HANDSHAKE_MS=$(python3 -c "import json; d=json.load(open('hack/bench/results/handshake.json')); ms=round(float(d['message'].rstrip('s'))*1000); print(ms)")
          export THROUGHPUT_MBPS=$(python3 -c "import json; d=json.load(open('hack/bench/results/throughput.json')); print(int(d['message'].split()[0]))")
          export API_P99_MS=$(python3 -c "import json; d=json.load(open('hack/bench/results/api-p99.json')); print(int(float(d['message'].rstrip('ms'))))")
          export TODAY=$(date -u +'%Y-%m-%d')
          python3 hack/bench/update_history.py

          [ -f index.html ] || echo "<html><body><p>Lattice benchmark results</p></body></html>" > index.html
          git add docs/benchmarks/ index.html
          git diff --cached --quiet || git commit -m "bench: update benchmark results $(date -u +'%Y-%m-%d')"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          docker rm -f bench-agent-a bench-agent-b lattice-k3s 2>/dev/null || true
          docker network rm bench-net 2>/dev/null || true
