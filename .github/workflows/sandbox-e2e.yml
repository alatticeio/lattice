name: Agent Sandbox E2E

on:
  push:
    branches:
      - dev
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    branches:
      - master
      - main

env:
  REGISTRY: ghcr.io
  CLUSTER_NAME: lattice-sandbox-e2e
  E2E_KUBECONFIG: /tmp/lattice-sandbox-e2e.kubeconfig

permissions:
  contents: read
  packages: write

jobs:
  sandbox-e2e:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-pro'))

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.32.1

      - name: Prepare metadata
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "tag=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          else
            echo "tag=e2e" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRO 构建：latticed（控制面）+ lattice（companion agent）+ lattice-agent-sandbox（被测沙箱）
      - name: Build PRO images
        run: |
          REGISTRY="${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}"
          TAG="${{ steps.meta.outputs.tag }}"
          CACHE="--cache-from type=gha --cache-to type=gha,mode=max"
          make docker-build SERVICE=latticed               TAG="${TAG}-pro" REGISTRY="$REGISTRY" EDITION=pro BUILD_CACHE_ARGS="$CACHE"
          make docker-build SERVICE=lattice                 TAG="${TAG}-pro" REGISTRY="$REGISTRY" EDITION=pro BUILD_CACHE_ARGS="$CACHE"
          make docker-build SERVICE=lattice-agent-sandbox   TAG="${TAG}-pro" REGISTRY="$REGISTRY" EDITION=pro BUILD_CACHE_ARGS="$CACHE"

      - name: Push images to GHCR
        if: github.event_name != 'pull_request'
        run: |
          REGISTRY="${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}"
          TAG="${{ steps.meta.outputs.tag }}"
          make docker-push SERVICE=latticed             TAG="${TAG}-pro" REGISTRY="$REGISTRY"
          make docker-push SERVICE=lattice               TAG="${TAG}-pro" REGISTRY="$REGISTRY"
          make docker-push SERVICE=lattice-agent-sandbox TAG="${TAG}-pro" REGISTRY="$REGISTRY"

      - name: Setup k3d cluster
        uses: AbsaOSS/k3d-action@v2
        with:
          cluster-name: ${{ env.CLUSTER_NAME }}
          args: >-
            --agents 0
            --no-lb
            --k3s-arg "--disable=traefik@server:*"

      - name: Export kubeconfig
        run: |
          k3d kubeconfig get ${{ env.CLUSTER_NAME }} > ${{ env.E2E_KUBECONFIG }}
          echo "KUBECONFIG=${{ env.E2E_KUBECONFIG }}" >> $GITHUB_ENV

      - name: Import images into k3d
        run: |
          REGISTRY="${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}"
          TAG="${{ steps.meta.outputs.tag }}"
          k3d image import "${REGISTRY}/latticed:${TAG}-pro"               -c ${{ env.CLUSTER_NAME }}
          k3d image import "${REGISTRY}/lattice:${TAG}-pro"                -c ${{ env.CLUSTER_NAME }}
          k3d image import "${REGISTRY}/lattice-agent-sandbox:${TAG}-pro" -c ${{ env.CLUSTER_NAME }}

      - name: Install kustomize
        run: make kustomize

      - name: Deploy Lattice All-in-One (PRO)
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          REGISTRY="${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}"
          TAG="${{ steps.meta.outputs.tag }}"
          make deploy-aio \
            IMG="${REGISTRY}/latticed:${TAG}-pro" \
            KUBECTL="kubectl --kubeconfig=${{ env.E2E_KUBECONFIG }}"

      - name: Run Agent Sandbox E2E tests
        run: |
          REGISTRY="${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}"
          TAG="${{ steps.meta.outputs.tag }}"
          go test ./test/e2e/ -v -timeout 15m -run "Agent Sandbox" \
            --agent-image="${REGISTRY}/lattice-agent-sandbox:${TAG}-pro" \
            --manage-url=http://localhost:8080

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          KC="kubectl --kubeconfig=${{ env.E2E_KUBECONFIG }}"

          echo "===== lattice-system: 控制面 Pod 状态 ====="
          $KC get all -n lattice-system -o wide || true

          echo "===== latticed 日志 (最近 300 行) ====="
          $KC logs -n lattice-system -l app.kubernetes.io/name=latticed --tail=300 || true

          echo "===== LatticePeer 汇总 ====="
          $KC get wfpeer --all-namespaces -o wide || true

          echo "===== AgentIdentity 汇总 ====="
          $KC get agentidentity --all-namespaces -o wide || true

      - name: Cleanup
        if: always()
        run: |
          k3d cluster delete ${{ env.CLUSTER_NAME }} || true
