name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    branches:
      - master
      - main

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/alatticeio

jobs:
  release:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ok-release'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Compute build variables
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
            IS_RELEASE=true
          else
            VERSION="pr-${{ github.event.pull_request.number }}"
            IS_RELEASE=false
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IS_RELEASE=$IS_RELEASE" >> "$GITHUB_ENV"

      - name: Run GoReleaser (release)
        if: env.IS_RELEASE == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Run GoReleaser (snapshot)
        if: env.IS_RELEASE != 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        run: npm install -g pnpm@10.32.1

      - name: Build UI
        run: make build-ui

      - name: Create buildx builder
        run: |
          docker buildx create --name lattice-builder --use
          docker buildx inspect --bootstrap

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push community images
        run: |
          for SERVICE in latticed lattice; do
            TAGS="--tag $REGISTRY/${SERVICE}:${VERSION}"
            if [ "$IS_RELEASE" = "true" ]; then
              TAGS="$TAGS --tag $REGISTRY/${SERVICE}:latest"
            fi
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --push \
              $TAGS \
              --build-arg "TARGETSERVICE=${SERVICE}" \
              --build-arg "VERSION=${VERSION}" \
              --build-arg "BUILD_TAGS=" \
              --label "org.opencontainers.image.title=${SERVICE}" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --cache-from "type=gha" \
              --cache-to "type=gha,mode=max" \
              -f Dockerfile .
          done

      - name: Build and push PRO images
        run: |
          for SERVICE in latticed lattice; do
            TAGS="--tag $REGISTRY/${SERVICE}:${VERSION}-pro"
            if [ "$IS_RELEASE" = "true" ]; then
              TAGS="$TAGS --tag $REGISTRY/${SERVICE}:latest-pro"
            fi
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --push \
              $TAGS \
              --build-arg "TARGETSERVICE=${SERVICE}" \
              --build-arg "VERSION=${VERSION}" \
              --build-arg "BUILD_TAGS=pro" \
              --label "org.opencontainers.image.title=${SERVICE}" \
              --label "org.opencontainers.image.version=${VERSION}-pro" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --cache-from "type=gha" \
              --cache-to "type=gha,mode=max" \
              -f Dockerfile .
          done
