name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - dev
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    branches:
      - master
      - main

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ─── Compute shared variables ─────────────────────────────────────────────────
  vars:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      is_release: ${{ steps.compute.outputs.is_release }}
      build_latest: ${{ steps.compute.outputs.build_latest }}
      push_image: ${{ steps.compute.outputs.push_image }}
    steps:
      - name: Compute build variables
        id: compute
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            IS_RELEASE=true
            BUILD_LATEST=true
            PUSH_IMAGE=true
          elif [ "${{ github.ref }}" = "refs/heads/master" ]; then
            VERSION="$(echo ${{ github.sha }} | cut -c1-7)"
            IS_RELEASE=false
            BUILD_LATEST=true
            PUSH_IMAGE=true
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            # Branch push: tag as sanitized branch name (e.g. dev, feature-foo)
            VERSION="$(echo '${{ github.ref_name }}' | sed 's|/|-|g')"
            IS_RELEASE=false
            BUILD_LATEST=false
            PUSH_IMAGE=true
          else
            VERSION="pr-${{ github.event.pull_request.number }}"
            IS_RELEASE=false
            BUILD_LATEST=false
            PUSH_IMAGE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "build_latest=$BUILD_LATEST" >> "$GITHUB_OUTPUT"
          echo "push_image=$PUSH_IMAGE" >> "$GITHUB_OUTPUT"

  # ─── GoReleaser: binaries + archives + helm ───────────────────────────────────
  goreleaser:
    needs: vars
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.vars.outputs.version }}
      IS_RELEASE: ${{ needs.vars.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser (release)
        if: env.IS_RELEASE == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Run GoReleaser (snapshot)
        if: env.IS_RELEASE != 'true' && github.event_name == 'pull_request'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean --skip=docker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart (PR validation)
        if: github.event_name == 'pull_request'
        run: |
          helm package deploy/charts/lattice \
            --version "0.0.0-${VERSION}" \
            --app-version ${VERSION}
          echo "Chart packaged: lattice-0.0.0-${VERSION}.tgz"

      - name: Install oras
        if: env.IS_RELEASE == 'true'
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        if: env.IS_RELEASE == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish Helm chart to GHCR
        if: env.IS_RELEASE == 'true'
        run: |
          CHART_VERSION=${VERSION#v}
          helm package deploy/charts/lattice \
            --version ${CHART_VERSION} \
            --app-version ${VERSION}
          helm push lattice-${CHART_VERSION}.tgz oci://ghcr.io/alatticeio/charts

      - name: Publish Artifact Hub repo metadata
        if: env.IS_RELEASE == 'true'
        run: |
          oras push ghcr.io/alatticeio/charts/artifacthub-repo:latest \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+json \
            deploy/charts/lattice/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  # ─── Docker: push master/tag 时推送，PR 加 run-docker label 时只验证构建 ─────────
  docker:
    needs: vars
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-docker'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.vars.outputs.version }}
      BUILD_LATEST: ${{ needs.vars.outputs.build_latest }}
      PUSH_IMAGE: ${{ needs.vars.outputs.push_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        run: npm install -g pnpm@10.32.1

      - name: Build UI
        run: make build-ui

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          if [ "$PUSH_IMAGE" = "true" ]; then
            OUTPUT="--push"
          else
            OUTPUT="--output type=cacheonly"
          fi

          for SERVICE in latticed lattice; do
            TAGS="--tag $REGISTRY/${SERVICE}:${VERSION}"
            [ "$BUILD_LATEST" = "true" ] && TAGS="$TAGS --tag $REGISTRY/${SERVICE}:latest"
            docker buildx build \
              --platform linux/amd64 \
              --provenance=false \
              $OUTPUT \
              $TAGS \
              --build-arg "TARGETSERVICE=${SERVICE}" \
              --build-arg "VERSION=${VERSION}" \
              --build-arg "BUILD_TAGS=pro" \
              --label "org.opencontainers.image.title=${SERVICE}" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --cache-from "type=gha,scope=${SERVICE}" \
              --cache-to "type=gha,mode=max,scope=${SERVICE}" \
              -f Dockerfile .
          done
