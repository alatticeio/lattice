version: 2
project_name: lattice

builds:
  # Edge Agent — Linux（pro 全功能，含 eBPF）
  - id: "lattice-linux"
    binary: "lattice"
    main: "./cmd/lattice/main.go"
    flags:
      - -tags=pro
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X lattice/pkg/version.Version={{.Version}}
      - -X lattice/pkg/version.GitCommit={{.Commit}}
      - -X lattice/pkg/version.BuildTime={{.Date}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  # Edge Agent — macOS / Windows（CLI 客户端，eBPF 不适用于非 Linux）
  - id: "lattice-darwin-windows"
    binary: "lattice"
    main: "./cmd/lattice/main.go"
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X lattice/pkg/version.Version={{.Version}}
      - -X lattice/pkg/version.GitCommit={{.Commit}}
      - -X lattice/pkg/version.BuildTime={{.Date}}
    goos:
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

  # All-in-One 控制面（嵌入 NATS + SQLite，仅 linux）
  - id: "latticed"
    binary: "latticed"
    main: "./cmd/latticed/main.go"
    flags:
      - -tags=pro
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X lattice/pkg/version.Version={{.Version}}
      - -X lattice/pkg/version.GitCommit={{.Commit}}
      - -X lattice/pkg/version.BuildTime={{.Date}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  # lattice agent 打包（面向边缘/终端用户）
  - id: "lattice-archive"
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - lattice-linux
      - lattice-darwin-windows
    format_overrides:
      - goos: windows
        format: zip

  # latticed 单独打包（面向服务端部署）
  - id: "latticed-archive"
    name_template: "latticed_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - latticed


brews:
  - name: lattice
    ids:
      - lattice-archive
    repository:
      owner: alatticeio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/alatticeio/lattice
    description: "Lattice edge agent — secure peer-to-peer networking"
    license: Apache 2.0
    test: |
      system "#{bin}/lattice", "version"
    install: |
      bin.install "lattice"
    commit_author:
      name: alatticeio-bot
      email: maintainers@alatticeio.io
    skip_upload: false
    dependencies: []


release:
  prerelease: auto
  replace_existing_artifacts: true

checksum:
  name_template: "checksums.txt"

# Docker 镜像由 release.yml 中独立的 docker-image job 构建和推送，
# goreleaser 只负责 binary/archive/changelog。
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
