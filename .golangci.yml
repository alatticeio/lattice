version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - asciicheck
    - bodyclose
  settings:
    govet:
      enable:
        - shadow
      disable:
        - slog
    errcheck:
      exclude-functions:
        - (net/http.Response).Body.Close
        - (io.Closer).Close
        - (io.ReadCloser).Close

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unused
          - govet

formatters:
  enable:
    - gofmt
