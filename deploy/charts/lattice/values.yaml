# -- Overrides the chart name.
nameOverride: ""

# -- Overrides the full app name.
fullnameOverride: ""

# -- Number of replicas for the deployment.
replicaCount: 1

# -- Container image configuration.
image:
  repository: ghcr.io/alatticeio/latticed
  tag: latest
  pullPolicy: IfNotPresent

# -- Service configuration.
service:
  type: LoadBalancer
  apiPort: 8080
  natsPort: 4222
  apiNodePort: ""
  natsNodePort: ""

# -- IngressRouteTCP for NATS (Traefik only).
# Requires Traefik with a custom entrypoint for the NATS port.
ingressRouteTCP:
  enabled: false
  entrypoint: nats  # must match the Traefik entrypoint name

# -- Ingress configuration for the dashboard API.
ingress:
  enabled: false
  className: ""
  host: lattice.example.com
  tls:
    enabled: false
    secretName: ""

# -- Persistent storage for SQLite data.
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

# -- Config file contents (lattice.yaml).
config:
  app:
    name: "Lattice"
    env: "production"
    listen: ":8080"
  jwt:
    secret: ""  # auto-generated if empty
    expireHours: 24
  signalingUrl: ""  # defaults to embedded NATS within the pod
  stunUrl: "stun.alattice.io:3478"  # STUN server address (host:port)
  database:
    dsn: "data/lattice.db"  # SQLite path

# -- Resource requests and limits.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# -- Built-in coturn STUN server (optional).
# Enable when there is no external STUN service available.
# Requires the node to have a public IP; hostPort 3478/UDP must be open.
# When enabled, set config.stunUrl to "<node-public-ip>:3478".
coturn:
  enabled: false
  image:
    repository: coturn/coturn
    tag: "4.6"
    pullPolicy: IfNotPresent

# -- Pro edition license (optional).
license:
  enabled: false
  # fileContents: "..."  # raw license JWT string

# -- Service account configuration.
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- Additional environment variables (e.g. APP_DATABASE_DSN for MySQL).
extraEnv: []

# -- Node selector for pod placement.
nodeSelector: {}

# -- Pod tolerations.
tolerations: []

# -- Pod affinity.
affinity: {}

# -- Annotations to add to the pod.
podAnnotations: {}
