# -- Overrides the chart name.
nameOverride: ""

# -- Overrides the full app name.
fullnameOverride: ""

# -- Number of replicas for the deployment.
replicaCount: 1

# -- Container image configuration.
image:
  repository: ghcr.io/alatticeio/latticed
  tag: latest
  pullPolicy: IfNotPresent

# -- Service configuration.
service:
  type: ClusterIP
  apiPort: 8080
  natsPort: 4222
  apiNodePort: ""
  natsNodePort: ""
  # -- Bind ports directly to the host via hostPort (recommended for single-node k3s).
  apiHostPort: true
  natsHostPort: true

# -- IngressRouteTCP for NATS (Traefik only).
# Requires Traefik with a custom entrypoint for the NATS port.
ingressRouteTCP:
  enabled: false
  entrypoint: nats  # must match the Traefik entrypoint name

# -- Ingress configuration for the dashboard API.
ingress:
  enabled: false
  className: ""
  host: lattice.example.com
  tls:
    enabled: false
    secretName: ""

# -- Persistent storage for SQLite data.
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

# -- Config file contents (lattice.yaml).
config:
  app:
    name: "Lattice"
    env: "production"
    listen: ":8080"
  jwt:
    secret: ""  # auto-generated if empty
    expireHours: 24
  signalingUrl: ""  # defaults to embedded NATS within the pod
  # -- Global default enforcer mode returned by /api/v1/discovery.
  # Agents use this when neither CLI flag nor user setting is configured.
  # Valid values: auto, iptables, ebpf
  enforcerMode: ""
  stunUrl: "stun.alattice.io:3478"  # STUN server address (host:port)
  database:
    dsn: "data/lattice.db"  # SQLite path
  # -- Zero-friction demo mode.
  demo:
    enabled: false
    ttlMinutes: 60
    rateLimitPerHour: 5

# -- Resource requests and limits.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# -- Built-in coturn STUN server (optional).
# Enable when there is no external STUN service available.
# Uses hostNetwork so coturn binds directly to the host NIC, avoiding K8s NAT issues.
# Requirements:
#   1. UDP 3478 must be open in the cloud security group (inbound + outbound).
#   2. Pin coturn to a node with a public IP via nodeSelector.
#   3. Set config.stunUrl to "<node-public-ip>:3478".
# Example:
#   coturn:
#     enabled: true
#     nodeSelector:
#       kubernetes.io/hostname: my-public-node
#   config:
#     stunUrl: "1.2.3.4:3478"
coturn:
  enabled: false
  image:
    repository: coturn/coturn
    tag: "4.6"
    pullPolicy: IfNotPresent
  # nodeSelector pins the coturn pod to a specific node that has a public IP.
  # Must be set when the cluster has multiple nodes.
  nodeSelector: {}

# -- Pro edition license (optional).
license:
  enabled: false
  # fileContents: "..."  # raw license JWT string

# -- Global IP pool for workspace subnet allocation (mirrors config/lattice/overlays/all-in-one/ip_pool.yaml).
# The controller hardcodes the name "lattice-ip-pool" in network_controller.go.
ipPool:
  cidr: "10.0.0.0/8"
  subnetMask: 24

# -- Service account configuration.
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- Additional environment variables (e.g. APP_DATABASE_DSN for MySQL).
extraEnv: []

# -- Node selector for pod placement.
nodeSelector: {}

# -- Pod tolerations.
tolerations: []

# -- Pod affinity.
affinity: {}

# -- Annotations to add to the pod.
podAnnotations: {}
