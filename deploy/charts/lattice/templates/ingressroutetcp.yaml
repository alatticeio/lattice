{{- if .Values.ingressRouteTCP.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "lattice.fullname" . }}-nats
  labels:
    {{- include "lattice.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.ingressRouteTCP.entrypoint }}
  routes:
    - match: HostSNI(`*`)
      services:
        - name: {{ include "lattice.fullname" . }}
          port: {{ .Values.service.natsPort }}
{{- end }}
