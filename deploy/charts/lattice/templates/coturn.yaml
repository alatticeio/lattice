{{- if .Values.coturn.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lattice.fullname" . }}-stun
  labels:
    {{- include "lattice.labels" . | nindent 4 }}
    app.kubernetes.io/component: stun
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "lattice.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: stun
  template:
    metadata:
      labels:
        {{- include "lattice.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: stun
    spec:
      # hostNetwork binds coturn directly to the host's network interface,
      # bypassing K8s iptables NAT (hostPort SNAT). This is required for STUN
      # to work correctly: without it, STUN responses may be sent from a pod
      # internal IP that clients cannot route to, causing XORMappedAddr timeouts.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.coturn.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: coturn
          image: "{{ .Values.coturn.image.repository }}:{{ .Values.coturn.image.tag }}"
          imagePullPolicy: {{ .Values.coturn.image.pullPolicy }}
          args:
            - "--stun-only"
            - "--listening-port=3478"
            - "--no-multicast-peers"
            - "--no-loopback-peers"
          ports:
            - containerPort: 3478
              protocol: UDP
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
{{- end }}
