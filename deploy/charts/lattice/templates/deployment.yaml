apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lattice.fullname" . }}
  labels:
    {{- include "lattice.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "lattice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "lattice.selectorLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      serviceAccountName: {{ include "lattice.serviceAccountName" . }}
      containers:
        - name: latticed
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: nats
              containerPort: 4222
              {{- if .Values.service.natsHostPort }}
              hostPort: {{ .Values.service.natsPort }}
              {{- end }}
              protocol: TCP
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: conf
              mountPath: /etc/lattice/lattice.yaml
              subPath: lattice.yaml
            {{- if .Values.license.enabled }}
            - name: license
              mountPath: /etc/lattice/license.jwt
              subPath: license.jwt
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "lattice.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: conf
          configMap:
            name: {{ include "lattice.fullname" . }}-config
            items:
              - key: lattice.yaml
                path: lattice.yaml
        {{- if .Values.license.enabled }}
        - name: license
          secret:
            secretName: {{ include "lattice.fullname" . }}-license
            items:
              - key: license.jwt
                path: license.jwt
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
