apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: lattice
  labels:
    app.sealos.io/category: "networking"
spec:
  title: "Lattice"
  url: "https://lattice.io"
  gitRepo: "https://github.com/alatticeio/lattice"
  author: "Lattice Authors"
  description: "Self-hosted WireGuard Mesh Orchestration. Kubernetes-native, AI-powered, open-core."
  readme: "https://raw.githubusercontent.com/alatticeio/lattice/master/README.md"
  icon: "https://lattice.io/logo.svg"
  templateType: inline
  defaults:
    app_host:
      type: random
      value: ${{ random(8) }}
    app_name:
      type: random
      value: lattice-${{ random(8) }}
  inputs:
    admin_email:
      description: "Admin email address"
      type: string
      default: "admin@example.com"
      required: true
    admin_password:
      description: "Admin password (min 8 characters)"
      type: string
      default: ""
      required: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      containers:
        - name: latticed
          image: ghcr.io/alatticeio/latticed:latest
          ports:
            - containerPort: 8080
            - containerPort: 4222
          env:
            - name: LATTICE_ADMIN_EMAIL
              value: ${{ inputs.admin_email }}
            - name: LATTICE_ADMIN_PASSWORD
              value: ${{ inputs.admin_password }}
            - name: LATTICE_SEED_DATA
              value: "true"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
spec:
  selector:
    app: ${{ defaults.app_name }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 8080
