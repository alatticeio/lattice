apiVersion: apps/v1
kind: Deployment
metadata:
  name: stun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stun
  template:
    metadata:
      labels:
        app: stun
    spec:
      # hostNetwork binds coturn directly to the host NIC, bypassing K8s iptables NAT.
      # Without this, STUN responses may be sent from the pod's internal IP,
      # causing "timeout while waiting for XORMappedAddr" on the client side.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: coturn
          image: coturn/coturn:4.6
          args:
            - "--stun-only"
            - "--listening-port=3478"
            - "--no-multicast-peers"
            - "--no-loopback-peers"
          ports:
            - containerPort: 3478
              protocol: UDP
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
