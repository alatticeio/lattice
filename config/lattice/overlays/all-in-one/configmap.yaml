apiVersion: v1
kind: ConfigMap
metadata:
  name: aio-config  # namePrefix 后: lattice-aio-config
data:
  lattice.yaml: |
    app:
      listen: :8080
      name: "LatticeFlow"
      env: "production"
      init_admins:
        - username: "admin"
          password: "123456"   # ⚠️ 生产环境请修改默认密码

    jwt:
      secret: "replace-with-random-secret"  # ⚠️ 请替换为随机密钥
      expire_hours: 24

    # all-in-one 模式：NATS 内嵌于 latticed 进程，进程内直连
    signaling-url: "nats://localhost:4222"

    database:
      # SQLite 路径相对于进程工作目录（Dockerfile WORKDIR=/app）
      # 实际文件：/app/data/lattice.db（对应 PVC 挂载点 /app/data）
      # 如需接入外部 MariaDB（企业级），替换为：
      # dsn: "root:pass@tcp(mariadb.lattice-system.svc:3306)/lattice?charset=utf8mb4&parseTime=True"
      dsn: "data/lattice.db"

    ai:
      enabled: true
      provider: anthropic          # anthropic / deepseek / openai / 自定义 OpenAI 兼容
      api-key: "YOUR_API_KEY"      # ⚠️ 生产环境建议通过 K8s Secret + 环境变量 LATTICE_AI_API_KEY 注入
      model: "mimo-v2.5-pro"       # MiMo 模型名；留空则使用 provider 默认值（anthropic 默认 claude-sonnet-4-6）
      base-url: "https://api.xiaomimimo.com/anthropic"  # 自定义 API 端点
      max-tool-calls: 5
      agent-isolation:
        enabled: true
        enforcement-mode: enforce
