                    MCPServer.
                  properties:
                    mcpServer:
                      description: MCPServer is the name of the MCPServer in the same
                        namespace.
                      type: string
                    tools:
                      description: Tools is the list of allowed tool names. Use ["*"]
                        to allow all tools.
                      items:
                        type: string
                      type: array
                  required:
                  - mcpServer
                  - tools
                  type: object
                type: array
              defaultDeny:
                description: DefaultDeny enables deny-by-default; only explicitly
                  listed tools are allowed.
                type: boolean
            required:
            - agentSelector
            type: object
