---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: agentidentities.alattice.io
spec:
  group: alattice.io
  names:
    kind: AgentIdentity
    listKind: AgentIdentityList
    plural: agentidentities
    shortNames:
    - agentid
    singular: agentidentity
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: PHASE
      type: string
    - jsonPath: .spec.peerRef
      name: PEER
      type: string
    - jsonPath: .spec.sandbox
      name: SANDBOX
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentIdentity binds an AI Agent's WireGuard Peer to its control-plane
          RBAC permissions.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentIdentitySpec defines the desired state of an AgentIdentity.
            properties:
              allowedNamespaces:
                description: |-
                  AllowedNamespaces restricts which K8s namespaces this agent's tool calls may affect.
                  Empty list means no namespaces are permitted.
                items:
                  type: string
                type: array
              allowedTools:
                description: |-
                  AllowedTools is the whitelist of tool names this agent may call.
                  Empty list means no tools are permitted.
                items:
                  type: string
                type: array
              auditLevel:
                default: write
                description: AuditLevel controls tool call logging verbosity for this
                  agent.
                type: string
              enforcementMode:
                default: enforce
                description: EnforcementMode can override the global agent-isolation
                  enforcement mode for this agent.
                type: string
              expiresAt:
                description: |-
                  ExpiresAt is the optional expiry time for this agent identity.
                  After this time the controller transitions the phase to Expired.
                  Nil means the identity never expires.
                format: date-time
                type: string
              parentRef:
                description: |-
                  ParentRef is the name of the parent AgentIdentity (sub-agent scenario).
                  Empty means this is a top-level agent.
                type: string
              peerRef:
                description: PeerRef is the name of the LatticePeer this agent is
                  bound to. Required.
                type: string
              sandbox:
                default: none
                description: Sandbox controls the hosting isolation mode for this
                  agent.
                type: string
              spawnableRoles:
                description: SpawnableRoles lists role template names this agent is
                  allowed to spawn as sub-agents.
                items:
                  type: string
                type: array
            required:
            - peerRef
            type: object
          status:
            description: AgentIdentityStatus defines the observed state of an AgentIdentity.
            properties:
              conditions:
                description: Conditions reflect control-plane sync state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSeenAt:
                description: LastSeenAt is the last time the agent made an authenticated
                  API call.
                format: date-time
                type: string
              peerIP:
                description: PeerIP is the VPN IP address allocated to this agent's
                  LatticePeer.
                type: string
              phase:
                description: Phase is the current lifecycle phase.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
